# Copy outside source control. Paths and authorization references must be selected locally.
[provider]
kind = "mock" # mock | ollama | openai-compatible
model = "fixture" # Choose only after benchmarking. No real-model quality claim is made.
base_url = "http://127.0.0.1:11434" # For compatible APIs use the base ending in /v1
api_key_env = "VET_AI_API_KEY"
allow_remote = false
allow_paid = false
context_char_limit = 12000
transcript_char_limit = 24000
timeout_seconds = 120

[transcription]
kind = "faster-whisper"
model = "" # Configure a local model path or tested model name. No automatic model download.
device = "cpu"
compute_type = "int8"
language = "en"
allow_model_download = false
max_text_context = -1 # whisper.cpp default; compare 0 in an isolated reference benchmark to reset text carry-over.
temperature_fallback = true # Keep historical decoding unless reviewed results justify an explicit change.
audio_filter = "none" # whisper-cpp only: none, highpass, or denoise (highpass + gentle FFT denoise); originals retained.

[retry]
max_attempts = 3
base_delay_seconds = 30

# GitHub is primary remote knowledge storage; enable after verifying the private checkout.
# No Google Drive/rclone credentials or encryption key are needed for GitHub sync.
[github]
enabled = false
checkout = "" # e.g. "/home/YOUR_USER/vet-knowledge-master"; dedicated main-branch checkout
allow_clinical = false # Requires separate storage authorization AND backup.allow_clinical_remote.
retry_seconds = 60
max_retry_seconds = 3600
verify_interval_seconds = 3600

[retention]
enabled = false
retain_source_audio = true
retain_transcripts = true
automatic_deletion = false
days = 14
require_remote = true

[backup]
remote = "" # Optional future independent provider; leave empty for normal GitHub/local operation.
allow_clinical_remote = false # Separate recording/processing authorization does not imply third-party storage authorization.
timeout_seconds = 300

[usb]
roots = [] # e.g. ["/media/YOUR_USER"]. USB mounts only; no arbitrary home scan.
device_label = "" # Optional additional match.
device_uuid = "" # Register actual filesystem UUID before unattended activation.
device_serial = "" # Match exact inherited USB device serial when available.
automount_read_only = false # Registration enables only for the exact registered device.
sentinel = "" # Optional relative marker filename, chosen by the owner.
glob = "**/*" # Extension is checked case-insensitively; filename layout is not assumed.
stable_seconds = 30
origin = "authorized-record"
authorization_ref = "" # Required before import; never published.

[archive]
timezone = "Unknown until configured" # e.g. America/Detroit. Does not verify device clock time.

[unattended]
simulation_root = "" # Nonempty only for isolated synthetic tests; never a production root.
gpu_busy_limit = 20
gpu_memory_limit_mb = 3000
reuse_idle_ollama = true # Require no open clients and a quiet GPU; never forcibly unload cached models.
reuse_free_memory_mb = 1024 # Extra VRAM required to reuse the exact model digest/context for extraction.
transcription_free_memory_mb = 6000 # Whisper must fit alongside any cached allocations.
session_hours = 8 # Import-batch window, not a guessed clinical shift duration.
timezone = "America/Detroit"
inhibit_sleep = true
