# Copy outside Git and replace paths with your isolated installation paths.
# Request-only settings. Does not modify Ollama/MMM/FCC defaults.
[provider]
kind = "ollama"
model = "qwen3:30b"
base_url = "http://127.0.0.1:11434"
allow_remote = false
allow_paid = false
timeout_seconds = 300
context_window = 8192
max_output_tokens = 4096
thinking = false
keep_alive = "0"
context_char_limit = 6000
transcript_char_limit = 12000

[transcription]
kind = "whisper-cpp"
executable = "/absolute/path/to/build-vulkan/bin/whisper-cli"
model = "/absolute/path/to/ggml-large-v3.bin"
language = "en"
threads = 4
gpu_device = 0
timeout_seconds = 1800
allow_model_download = false
